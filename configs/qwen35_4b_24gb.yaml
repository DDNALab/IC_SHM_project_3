run_name: qwen35_4b_shm
seed: 2026

model:
  model_id: Qwen/Qwen3.5-4B
  precision: bf16
  # Qwen vision processors use a 28x28 pixel/token scale. These values correspond
  # to approximately 256-512 visual tokens and are a conservative 24 GB starting point.
  min_pixels: 200704       # 256 * 28 * 28
  max_pixels: 401408       # 512 * 28 * 28
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  # "language" freezes the vision tower; use "all" only as a later ablation.
  lora_scope: language

data:
  train_csv: outputs/tables/train.csv
  val_csv: outputs/tables/val.csv
  max_length: 1024
  use_assistant_mask: true

training:
  output_dir: outputs/checkpoints/qwen35_4b_shm
  num_train_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.0002
  weight_decay: 0.01
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  logging_steps: 5
  eval_steps: 50
  save_steps: 50
  save_total_limit: 2
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  max_grad_norm: 1.0
  tf32: true
  report_to:
    - tensorboard
  dataloader_num_workers: 0
